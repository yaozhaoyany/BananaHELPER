name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: docker compose config --quiet
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run test:db
      - run: npm run db:backup
      - name: Verify backup restoration into a separate database
        run: |
          docker compose exec -T postgres sh -c 'createdb -U "$POSTGRES_USER" banana_restore'
          for backup in data/backups/*.dump; do
            docker compose exec -T postgres sh -c 'pg_restore -U "$POSTGRES_USER" -d banana_restore --no-owner --no-privileges --exit-on-error' < "$backup"
          done
          DATABASE_URL=postgresql://banana_owner:ci-only-password@127.0.0.1:5432/banana_restore npm run db:check
      - name: Database logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop database
        if: always()
        run: docker compose --profile database down
